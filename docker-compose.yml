version: '3.8'

# =================================================================
# Docker Compose: Multi-Service College Canteen Tracker
# Lab Expt 3: To deploy multi-service applications using Docker Compose
# Lab Expt 7: Monitoring using Prometheus / Grafana
# =================================================================

services:
  # 1. PostgreSQL Database Service
  postgres:
    image: postgres:15-alpine
    container_name: canteen-postgres
    restart: always
    environment:
      POSTGRES_USER: canteen_user
      POSTGRES_PASSWORD: canteen_pass
      POSTGRES_DB: canteen_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - canteen-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U canteen_user -d canteen_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  # 2. Python Flask REST Backend & Prometheus Metrics
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: canteen-backend
    restart: always
    ports:
      - "5000:5000"
    environment:
      DATABASE_URL: postgresql://canteen_user:canteen_pass@postgres:5432/canteen_db
      PORT: 5000
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - canteen-network
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:5000/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3

  # 3. React + Nginx Frontend Service
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: canteen-frontend
    restart: always
    ports:
      - "3000:80"
    depends_on:
      - backend
    networks:
      - canteen-network

  # 4. Prometheus Monitoring & Metrics Scraper (Expt 7)
  prometheus:
    image: prom/prometheus:v2.52.0
    container_name: canteen-prometheus
    restart: always
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/usr/share/prometheus/console_libraries'
      - '--web.console.templates=/usr/share/prometheus/consoles'
    depends_on:
      - backend
    networks:
      - canteen-network

  # 5. Grafana Visual Dashboard (Expt 7)
  grafana:
    image: grafana/grafana:10.4.2
    container_name: canteen-grafana
    restart: always
    ports:
      - "3001:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/etc/grafana/provisioning/dashboards:ro
    depends_on:
      - prometheus
    networks:
      - canteen-network

networks:
  canteen-network:
    driver: bridge

volumes:
  postgres_data:
